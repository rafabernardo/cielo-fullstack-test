spring:
  application:
    name: backend
  # Local overrides (see .env.example); real environment variables win over it.
  config:
    import: optional:file:.env[.properties]
  mvc:
    async:
      # Lifetime of an SSE stream; the browser's EventSource reconnects and receives the current status again.
      request-timeout: 60s
  data:
    web:
      pageable:
        default-page-size: 5
        max-page-size: 20

springdoc:
  default-produces-media-type: application/json

server:
  port: ${SERVER_PORT:8080}

central-convenios:
  base-url: ${CENTRAL_CONVENIOS_BASE_URL:http://localhost:4000}
  connect-timeout: ${CENTRAL_CONVENIOS_CONNECT_TIMEOUT:2s}
  read-timeout: ${CENTRAL_CONVENIOS_READ_TIMEOUT:5s}
  default-retry-after: 2s

portability:
  status-poll-enabled: true
  # Internal tick only: each operation is checked again when the Central's Retry-After says so.
  status-poll-tick: 5s
