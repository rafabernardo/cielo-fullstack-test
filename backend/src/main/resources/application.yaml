spring:
  application:
    name: backend
  mvc:
    async:
      # Lifetime of an SSE stream; the browser's EventSource reconnects and receives the current status again.
      request-timeout: 60s
  data:
    web:
      pageable:
        default-page-size: 5
        max-page-size: 20

springdoc:
  default-produces-media-type: application/json

central-convenios:
  base-url: http://localhost:4000
  connect-timeout: 2s
  read-timeout: 5s
  default-retry-after: 2s

portability:
  status-poll-enabled: true
  # Internal tick only: each operation is checked again when the Central's Retry-After says so.
  status-poll-tick: 1s
